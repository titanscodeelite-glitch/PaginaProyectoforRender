{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-4 text-center">Crear Cuenta</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="es_admin" class="form-check-input" id="esAdminCheck">
                    <label class="form-check-label" for="esAdminCheck">Quiero registrarme como Vendedor / Administrador</label>
                </div>
                <button type="submit" class="btn btn-warning w-100 py-2 fw-bold">Registrarse</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
