{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-4">Simulación de Pago Seguro</h3>
            <p class="text-muted">Monto total a pagar: <span class="fs-4 text-success fw-bold">${{ "%.2f"|format(total) }}</span></p>
            <form action="{{ url_for('checkout') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Nombre en la Tarjeta</label>
                    <input type="text" class="form-control" required placeholder="Ej. Juan Pérez">
                </div>
                <div class="mb-3">
                    <label class="form-label">Número de Tarjeta</label>
                    <input type="text" class="form-control" maxlength="16" required placeholder="4111 2222 3333 4444">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Expiración</label>
                        <input type="text" class="form-control" placeholder="MM/AA" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">CVV</label>
                        <input type="password" class="form-control" maxlength="4" required placeholder="123">
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold mt-3">Confirmar y Pagar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
